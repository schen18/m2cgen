name: GitHub Actions

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    name: "Python ${{ matrix.python }}, Test: ${{ matrix.lang }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.12"
          - "3.13"
        lang:
          - "API"
          - "python or java or javascript or php or rust"
          - "c_sharp or visual_basic or powershell"
          - "sql"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - name: Build Docker image
        run: docker build . --file Dockerfile -t m2cgen-docker --build-arg python=${{ matrix.python }}
      - name: Run tests (lint)
        if: matrix.lang == 'API'
        run: docker run --ulimit stack=-1 -v "$GITHUB_WORKSPACE":"/m2cgen" m2cgen-docker make flake8 isort-check
      - name: Run tests (unit)
        if: matrix.lang == 'API'
        run: docker run --ulimit stack=-1 -v "$GITHUB_WORKSPACE":"/m2cgen" m2cgen-docker make test-api
      - name: Run tests (code examples)
        if: matrix.lang == 'API'
        run: docker run --ulimit stack=-1 -v "$GITHUB_WORKSPACE":"/m2cgen" m2cgen-docker make generate-code-examples
      - name: Run tests
        if: matrix.lang != 'API'
        run: |
          export TEST="E2E";
          docker run \
            --ulimit stack=-1 \
            -v "$GITHUB_WORKSPACE":"/m2cgen" \
            -e TEST \
            -e LANG="${{ matrix.lang }}" \
            m2cgen-docker \
            bash /m2cgen/.ci/test.sh
      - name: Generate artifact with code examples
        if: matrix.python == '3.12' && matrix.lang == 'API'
        uses: actions/upload-artifact@v4
        with:
          name: code_examples
          path: ${{ github.workspace }}/generated_code_examples/
          if-no-files-found: error
  all-successful:
    # https://github.community/t/is-it-possible-to-require-all-github-actions-tasks-to-pass-without-enumerating-them/117957/4?u=graingert
    runs-on: ubuntu-latest
    needs: test
    steps:
    - name: Note that all tests succeeded
      run: echo "🎉"
